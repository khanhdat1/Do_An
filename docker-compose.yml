services:
  mysql:
    image: mysql:8.0
    container_name: pczone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pczone
    # utf8mb4 là bắt buộc: utf8 của MySQL chỉ 3 byte, không chứa được emoji
    # và một số ký tự — tên sản phẩm với nội dung đánh giá sẽ bị lỗi.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - pczone_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pczone_mysqldata:
